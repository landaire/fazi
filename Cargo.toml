[package]
name = "fazi"
description = "A drop-in replacement for libFuzzer"
version = "0.2.1"
edition = "2021"
author = "Lander Brandt"
readme = "README.md"
keywords = ["fuzzing", "libfuzzer"]
repo = "https://github.com/landaire/fazi"
documentation = "https://docs.rs/fazi"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.9.0"
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4.5.36", features = ["derive"] }
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
once_cell = "1.13"
paste = "1.0"
protobuf = { version = "4.0.0-alpha.0", git = "https://github.com/landaire/rust-protobuf.git", branch = "fazi", package = "protobuf", optional = true }
thread-id = "5.0.0"
backtrace = "0.3"
indicatif = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[features]
default = ["sancov", "hook_builtins", "structured_fuzzing"]
# SanitizerCoverage runtime for instrumented host code (callbacks, libc
# comparison hooks, sanitizer integration). Requires a nightly toolchain.
sancov = []
# API for targets whose execution the host does not instrument, such as
# emulators: coverage and comparisons are reported by the embedder. Builds on
# stable.
embed = []
main_entrypoint = ["sancov", "dep:indicatif"]
hook_memcmp = ["sancov"]
hook_bcmp = ["sancov"]
hook_strncmp = ["sancov"]
hook_strncasecmp = ["sancov"]
hook_strcasecmp = ["sancov"]
hook_strstr = ["sancov"]
hook_strcasestr = ["sancov"]
hook_memem = ["sancov"]
hook_builtins = [
    "hook_memcmp",
    "hook_bcmp",
    "hook_strncmp",
    "hook_strncasecmp",
    "hook_strcasecmp",
    "hook_strstr",
    "hook_strcasestr",
    "hook_memem",
]
structured_fuzzing = []
protobuf = ["dep:protobuf", "structured_fuzzing"]

[[example]]
name = "simple_harness"

[[test]]
name = "embed"
required-features = ["embed"]

[profile.release]
panic = 'abort'
